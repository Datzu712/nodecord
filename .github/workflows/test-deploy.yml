name: Preview deployment

on:
    pull_request:
        branches:
            - main

concurrency:
    group: cloudflare-pages-preview-${{ github.head_ref }}
    cancel-in-progress: true

jobs:
    preview:
        name: Build and deploy preview
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile
            - name: Build website
              run: pnpm turbo build --filter=docs

            # Pull requests opened from forks do not receive repository secrets,
            # so the preview is skipped there and the build above is the check.
            #
            # wrangler comes from the workspace root devDependencies, so the
            # action resolves it and skips installing. wranglerVersion is left
            # unset on purpose, see the note in deploy.yml.
            - name: Deploy preview to Cloudflare Pages
              id: preview
              if: github.event.pull_request.head.repo.full_name == github.repository
              uses: cloudflare/wrangler-action@v4
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  command: pages deploy apps/docs/build --project-name=nodecord --branch=${{ github.head_ref }}

            - name: Report preview URL
              if: steps.preview.outcome == 'success'
              run: |
                  echo "Preview: ${{ steps.preview.outputs.deployment-url }}" >> "$GITHUB_STEP_SUMMARY"
