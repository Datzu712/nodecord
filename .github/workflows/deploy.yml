name: Deploy docs to Cloudflare Pages

on:
    push:
        branches:
            - main

concurrency:
    group: cloudflare-pages-production
    cancel-in-progress: false

jobs:
    deploy:
        name: Build and deploy
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile
            - name: Build website
              run: pnpm turbo build --filter=docs

            # packageManager is pinned to npm on purpose. The action installs
            # wrangler with whichever package manager it detects, and detection
            # lands on pnpm here because of pnpm-lock.yaml. wrangler pulls in
            # workerd, which has a postinstall script, and pnpm 11 exits 1 with
            # ERR_PNPM_IGNORED_BUILDS unless the package is listed under
            # allowBuilds in pnpm-workspace.yaml. Approving build scripts for a
            # package that is not a project dependency would be the wrong fix.
            - name: Deploy to Cloudflare Pages
              uses: cloudflare/wrangler-action@v4
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  packageManager: npm
                  command: pages deploy apps/docs/build --project-name=nodecord --branch=main
