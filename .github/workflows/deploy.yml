name: Deploy docs to Cloudflare Pages

on:
    push:
        branches:
            - main

concurrency:
    group: cloudflare-pages-production
    cancel-in-progress: false

jobs:
    deploy:
        name: Build and deploy
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile
            - name: Build website
              run: pnpm turbo build --filter=docs

            # wrangler is a devDependency of the workspace root, so the install
            # step above already provides it. Leaving wranglerVersion unset is
            # deliberate: the action then resolves the pre-installed binary and
            # skips installing anything, which keeps the deployed version pinned
            # by pnpm-lock.yaml. Setting it here would trigger a reinstall.
            - name: Deploy to Cloudflare Pages
              uses: cloudflare/wrangler-action@v4
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  command: pages deploy apps/docs/build --project-name=nodecord --branch=main
